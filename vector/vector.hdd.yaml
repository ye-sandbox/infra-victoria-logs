# ==============================================================================
# Vector Configuration — Profile: HDD (Disco Mecânico)
# ==============================================================================
# Otimizado para minimizar IOPS aleatório e evitar I/O wait no host:
# - Buffer em RAM (memory) para eliminar escrita dupla no HD mecânico.
# - Lotes maiores (2 MB / 15s) para maximizar escrita sequencial contínua e cortar ~87% da frequência de I/O.
# - Descarte no edge de pings vazios de healthcheck para poupar ciclos de disco.
# ==============================================================================

data_dir: /var/lib/vector

# ------------------------------------------------------------------------------
# SOURCES (Entradas de Logs)
# ------------------------------------------------------------------------------
sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - vector
    auto_partial_merge: true
    multiline:
      start_pattern: '^[\S]'
      condition_pattern: '^[\s]'
      mode: continue_through
      timeout_ms: 1000

  syslog_udp:
    type: syslog
    mode: udp
    address: 0.0.0.0:5140

  http_logs:
    type: http_server
    address: 0.0.0.0:8686
    path: /logs
    encoding: json

  vector_metrics:
    type: internal_metrics
    namespace: vector
    scrape_interval_secs: 15

# ------------------------------------------------------------------------------
# TRANSFORMS (Normalização e Enriquecimento via VRL)
# ------------------------------------------------------------------------------
transforms:
  remap_docker:
    type: remap
    inputs:
      - docker_logs
    source: |
      msg = string(.message) ?? ""

      # OTIMIZAÇÃO HD: Descarta pings vazios de healthcheck e scrapes de rotina para poupar IOPS e armazenamento
      if match(msg, r'(?i)\b(healthcheck|kube-probe|GET /health|GET /ping|GET /ready|GET /metrics|scrape)\b') && !match(msg, r'(?i)\b(error\w*|fail\w*|warn\w*|401|403|500|502|503|504)\b') {
        abort
      }

      .timestamp = .timestamp || now()
      .host = get_env_var("HOST_IDENTIFIER") ?? "unknown-host"
      .container_name = .container_name || "unknown"
      .stream = .stream || "stdout"
      
      # Tenta decodificar JSON caso a aplicação emita logs estruturados
      parsed, err = parse_json(msg)
      if err == null {
        if exists(parsed.level) {
          .level = downcase(string(parsed.level) ?? "info")
        }
        if exists(parsed.app) {
          .app = downcase(string(parsed.app) ?? "unknown")
          .service = .app
        }
        if exists(parsed.env) {
          .env = downcase(string(parsed.env) ?? "production")
        }
        if exists(parsed.message) {
          .message = string(parsed.message) ?? msg
        } else if exists(parsed.msg) {
          .message = string(parsed.msg) ?? msg
        }

        # Promoção Canônica de Campos de Correlação
        if exists(parsed.trace_id) {
          .trace_id = string(parsed.trace_id) ?? null
        } else if exists(parsed.traceId) {
          .trace_id = string(parsed.traceId) ?? null
        } else if exists(parsed.trace) {
          .trace_id = string(parsed.trace) ?? null
        }

        if exists(parsed.request_id) {
          .request_id = string(parsed.request_id) ?? null
        } else if exists(parsed.requestId) {
          .request_id = string(parsed.requestId) ?? null
        } else if exists(parsed.correlation_id) {
          .request_id = string(parsed.correlation_id) ?? null
        } else if exists(parsed.reqId) {
          .request_id = string(parsed.reqId) ?? null
        }

        if exists(parsed.http_status) {
          .http_status = to_int(parsed.http_status) ?? null
        } else if exists(parsed.statusCode) {
          .http_status = to_int(parsed.statusCode) ?? null
        } else if exists(parsed.status) {
          .http_status = to_int(parsed.status) ?? null
        }

        if exists(parsed.duration_ms) {
          .duration_ms = to_float(parsed.duration_ms) ?? null
        } else if exists(parsed.duration) {
          .duration_ms = to_float(parsed.duration) ?? null
        } else if exists(parsed.latency_ms) {
          .duration_ms = to_float(parsed.latency_ms) ?? null
        } else if exists(parsed.elapsed_ms) {
          .duration_ms = to_float(parsed.elapsed_ms) ?? null
        }

        .structured = parsed
      } else {
        if match(msg, r'(?i)\b(fatal|panic|error|exception)\b') {
          .level = "error"
        } else if match(msg, r'(?i)\b(warn|warning)\b') {
          .level = "warn"
        } else if match(msg, r'(?i)\b(debug|trace)\b') {
          .level = "debug"
        } else {
          .level = "info"
        }
      }

      .app = .app || string(.container_name) ?? "unknown"
      .env = .env || "production"
      .service = .service || string(.container_name) ?? "unknown"

      # Salvaguarda: Teto preventivo de tamanho de mensagem (clamping em 8 KB para logs não-críticos)
      if .level != "error" {
        msg_str = string(.message) ?? ""
        msg_len = length(msg_str)
        if msg_len > 8192 {
          .message = truncate(msg_str, 8192) + " ... [truncated by collector: " + to_string(msg_len) + " bytes total]"
          .truncated = true
        }
      }

  remap_syslog:
    type: remap
    inputs:
      - syslog_udp
    source: |
      .timestamp = .timestamp || now()
      .host = .host || get_env_var("HOST_IDENTIFIER") ?? "syslog-host"
      .service = string(.appname) ?? "syslog"
      .app = .service
      .env = "production"
      .container_name = "syslog"
      .stream = "syslog"
      
      syslog_msg = string(.message) ?? ""
      base_level = downcase(string(.severity) ?? "info")
      if match(syslog_msg, r'(?i)\b(fatal|panic|error|failed|segfault)\b') {
        .level = "error"
      } else if match(syslog_msg, r'(?i)\b(warn|warning)\b') {
        .level = "warn"
      } else {
        .level = base_level
      }

  remap_http:
    type: remap
    inputs:
      - http_logs
    source: |
      .timestamp = .timestamp || now()
      .host = .host || get_env_var("HOST_IDENTIFIER") ?? "http-client"
      .app = downcase(string(.app) ?? string(.service) ?? "http-source")
      .service = .app
      .env = downcase(string(.env) ?? "production")
      .container_name = .container_name || .service
      .stream = .stream || "http"
      .level = downcase(string(.level) ?? "info")

      # Promoção Canônica de Campos de Correlação
      if exists(.trace_id) {
        .trace_id = string(.trace_id) ?? null
      } else if exists(.traceId) {
        .trace_id = string(.traceId) ?? null
      }

      if exists(.request_id) {
        .request_id = string(.request_id) ?? null
      } else if exists(.requestId) {
        .request_id = string(.requestId) ?? null
      } else if exists(.correlation_id) {
        .request_id = string(.correlation_id) ?? null
      }

      if exists(.http_status) {
        .http_status = to_int(.http_status) ?? null
      } else if exists(.statusCode) {
        .http_status = to_int(.statusCode) ?? null
      } else if exists(.status) {
        .http_status = to_int(.status) ?? null
      }

      if exists(.duration_ms) {
        .duration_ms = to_float(.duration_ms) ?? null
      } else if exists(.duration) {
        .duration_ms = to_float(.duration) ?? null
      } else if exists(.latency_ms) {
        .duration_ms = to_float(.latency_ms) ?? null
      }

      .message = string(.message) ?? encode_json(.)

      # OTIMIZAÇÃO: Descarta pings vazios de healthcheck e scrapes de rotina para poupar IOPS e armazenamento
      http_msg = string(.message)
      if match(http_msg, r'(?i)\b(healthcheck|kube-probe|GET /health|GET /ping|GET /ready|GET /metrics|scrape)\b') && !match(http_msg, r'(?i)\b(error\w*|fail\w*|warn\w*|401|403|500|502|503|504)\b') && (.level != "error" && .level != "warn") {
        abort
      }

      # Salvaguarda: Teto preventivo de tamanho de mensagem (clamping em 8 KB para logs não-críticos)
      if .level != "error" {
        msg_str = string(.message)
        msg_len = length(msg_str)
        if msg_len > 8192 {
          .message = truncate(msg_str, 8192) + " ... [truncated by collector: " + to_string(msg_len) + " bytes total]"
          .truncated = true
        }
      }

# ------------------------------------------------------------------------------
# SINKS (Destino: VictoriaLogs)
# ------------------------------------------------------------------------------
sinks:
  victorialogs:
    type: http
    inputs:
      - remap_docker
      - remap_syslog
      - remap_http
    uri: "http://${VICTORIALOGS_AUTH_USERPASS:-}victorialogs:9428/insert/jsonline"
    compression: zstd
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 2097152 # 2 MB por lote (ideal para escrita sequencial contínua em HD)
      timeout_secs: 15   # Aguarda até 15s para consolidar logs em RAM antes de gravar no HD
    healthcheck:
      enabled: false
    request:
      concurrency: 1     # Evita contenção na agulha mecânica
      headers:
        VL-Stream-Fields: "host,container_name,service,app,env,stream"
        VL-Time-Field: "timestamp"
        VL-Msg-Field: "message"
        AccountID: "0"
        ProjectID: "0"
    buffer:
      type: memory       # Buffer em RAM: ZERA a escrita dupla no HD
      max_events: 10000  # Máximo de eventos em repouso
      when_full: drop_newest

  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - vector_metrics
    address: 0.0.0.0:9598
