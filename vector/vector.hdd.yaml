# ==============================================================================
# Vector Configuration — Profile: HDD (Disco Mecânico)
# ==============================================================================
# Otimizado para minimizar IOPS aleatório e evitar I/O wait no host:
# - Buffer em RAM (memory) para eliminar escrita dupla no HD mecânico.
# - Lotes maiores (2 MB / 2s) para maximizar escrita sequencial contínua.
# - Descarte no edge de pings vazios de healthcheck para poupar ciclos de disco.
# ==============================================================================

data_dir: /var/lib/vector

# ------------------------------------------------------------------------------
# SOURCES (Entradas de Logs)
# ------------------------------------------------------------------------------
sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - vector
    auto_partial_merge: true
    multiline:
      start_pattern: '^[\S]'
      condition_pattern: '^[\s]'
      mode: halt_before
      timeout_ms: 1000

  syslog_udp:
    type: syslog
    mode: udp
    address: 0.0.0.0:5140

  http_logs:
    type: http_server
    address: 0.0.0.0:8686
    path: /logs
    encoding: json

  vector_metrics:
    type: internal_metrics
    namespace: vector
    scrape_interval_secs: 15

# ------------------------------------------------------------------------------
# TRANSFORMS (Normalização e Enriquecimento via VRL)
# ------------------------------------------------------------------------------
transforms:
  remap_docker:
    type: remap
    inputs:
      - docker_logs
    source: |
      msg = string(.message) ?? ""

      # OTIMIZAÇÃO HD: Descarta pings vazios de healthcheck para poupar IOPS
      if match(msg, r'(?i)\b(healthcheck|kube-probe|GET /health|GET /ping|GET /ready)\b') && !match(msg, r'(?i)\b(error|fail|warn)\b') {
        abort
      }

      .timestamp = .timestamp || now()
      .host = get_env_var("HOST_IDENTIFIER") ?? "unknown-host"
      .container_name = .container_name || "unknown"
      .stream = .stream || "stdout"
      
      # Tenta decodificar JSON caso a aplicação emita logs estruturados
      parsed, err = parse_json(msg)
      if err == null {
        if exists(parsed.level) {
          .level = downcase(string(parsed.level) ?? "info")
        }
        if exists(parsed.app) {
          .app = downcase(string(parsed.app) ?? "unknown")
          .service = .app
        }
        if exists(parsed.env) {
          .env = downcase(string(parsed.env) ?? "production")
        }
        if exists(parsed.message) {
          .message = string(parsed.message) ?? msg
        } else if exists(parsed.msg) {
          .message = string(parsed.msg) ?? msg
        }
        .structured = parsed
      } else {
        if match(msg, r'(?i)\b(fatal|panic|error|exception)\b') {
          .level = "error"
        } else if match(msg, r'(?i)\b(warn|warning)\b') {
          .level = "warn"
        } else if match(msg, r'(?i)\b(debug|trace)\b') {
          .level = "debug"
        } else {
          .level = "info"
        }
      }

      .app = .app || string(.container_name) ?? "unknown"
      .env = .env || "production"
      .service = .service || string(.container_name) ?? "unknown"

  remap_syslog:
    type: remap
    inputs:
      - syslog_udp
    source: |
      .timestamp = .timestamp || now()
      .host = .host || get_env_var("HOST_IDENTIFIER") ?? "syslog-host"
      .service = string(.appname) ?? "syslog"
      .app = .service
      .env = "production"
      .container_name = "syslog"
      .stream = "syslog"
      .level = downcase(string(.severity) ?? "info")

  remap_http:
    type: remap
    inputs:
      - http_logs
    source: |
      .timestamp = .timestamp || now()
      .host = .host || get_env_var("HOST_IDENTIFIER") ?? "http-client"
      .app = downcase(string(.app) ?? string(.service) ?? "http-source")
      .service = .app
      .env = downcase(string(.env) ?? "production")
      .container_name = .container_name || .service
      .stream = .stream || "http"
      .level = downcase(string(.level) ?? "info")
      .message = string(.message) ?? encode_json(.)

# ------------------------------------------------------------------------------
# SINKS (Destino: VictoriaLogs)
# ------------------------------------------------------------------------------
sinks:
  victorialogs:
    type: http
    inputs:
      - remap_docker
      - remap_syslog
      - remap_http
    uri: "http://${VICTORIALOGS_AUTH_USERPASS:-}victorialogs:9428/insert/jsonline"
    compression: zstd
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 2097152 # 2 MB por lote (ideal para escrita sequencial contínua em HD)
      timeout_secs: 2    # Aguarda 2s para consolidar
    healthcheck:
      enabled: false
    request:
      concurrency: 1     # Evita contenção na agulha mecânica
      headers:
        VL-Stream-Fields: "host,container_name,service,app,env,stream"
        VL-Time-Field: "timestamp"
        VL-Msg-Field: "message"
        AccountID: "0"
        ProjectID: "0"
    buffer:
      type: memory       # Buffer em RAM: ZERA a escrita dupla no HD
      max_events: 10000  # Máximo de eventos em repouso
      when_full: drop_newest

  prometheus_metrics:
    type: prometheus_exporter
    inputs:
      - vector_metrics
    address: 0.0.0.0:9598
