services:
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_VERSION:-latest}
    container_name: victorialogs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=${RETENTION_PERIOD:-1y}"
      - "-httpListenAddr=:${VICTORIALOGS_HTTP_PORT:-9428}"
      - "-memory.allowedPercent=${VICTORIALOGS_MEMORY_ALLOWED_PERCENT:-60}"
      - "-search.maxQueryDuration=${VL_MAX_QUERY_DURATION:-30s}"
      - "-search.maxConcurrentRequests=${VL_MAX_CONCURRENT_REQUESTS:-2}"
      - "-inmemoryDataFlushInterval=${VL_INMEMORY_FLUSH_INTERVAL:-15s}"
      - "-httpAuth.username=${VICTORIALOGS_AUTH_USERNAME:-}"
      - "-httpAuth.password=${VICTORIALOGS_AUTH_PASSWORD:-}"
    ports:
      - "${VICTORIALOGS_HTTP_PORT:-9428}:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    networks:
      - logging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 80M
          cpus: "0.50"
        reservations:
          memory: 30M
    healthcheck:
      test: ["CMD", "/victoria-logs-prod", "-version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.45.0-alpine}
    container_name: vector
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    environment:
      VECTOR_LOG: ${VECTOR_LOG_LEVEL:-warn}
      HOST_IDENTIFIER: ${HOST_IDENTIFIER:-proxmox-homelab}
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      VICTORIALOGS_AUTH_USERPASS: "${VICTORIALOGS_AUTH_USERNAME:+${VICTORIALOGS_AUTH_USERNAME}:${VICTORIALOGS_AUTH_PASSWORD}@}"
    ports:
      - "${VECTOR_SYSLOG_PORT:-5140}:5140/udp"
      - "${VECTOR_HTTP_PORT:-8686}:8686"
      - "${VECTOR_METRICS_PORT:-9598}:9598"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.${STORAGE_PROFILE:-hdd}.yaml:/etc/vector/vector.yaml:ro
      - ./vector:/etc/vector:ro
      - vector_data:/var/lib/vector
    networks:
      - logging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      victorialogs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 60M
          cpus: "0.50"
        reservations:
          memory: 20M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8686 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  vmalert:
    image: victoriametrics/vmalert:${VMALERT_VERSION:-latest}
    container_name: vmalert
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    profiles:
      - alerting
    command:
      - "-rule=/etc/vmalert/rules.yaml"
      - "-datasource.url=http://victorialogs:9428"
      - "-datasource.basicAuth.username=${VICTORIALOGS_AUTH_USERNAME:-}"
      - "-datasource.basicAuth.password=${VICTORIALOGS_AUTH_PASSWORD:-}"
      - "-notifier.url=${VMALERT_NOTIFIER_URL:-http://127.0.0.1:9093}"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
    ports:
      - "${VMALERT_HTTP_PORT:-8880}:8880"
    volumes:
      - ./vmalert/rules.yaml:/etc/vmalert/rules.yaml:ro
    networks:
      - logging-network
    depends_on:
      victorialogs:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 25M
          cpus: "0.20"
        reservations:
          memory: 10M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  logging-network:
    name: logging-network
    driver: bridge

volumes:
  victorialogs_data:
    name: victorialogs_data
  vector_data:
    name: vector_data
